const questions=[{"type": "mc", "prompt": "Câu 3. Cuộc cách mạng nào sau đây (cuối thế kỷ XVIII), mở ra thời kì thắng lợi và củng cố của chủ nghĩa tư bản?", "options": [{"text": "Cách mạng tư sản Anh.", "correct": false}, {"text": "Cuộc đấu tranh thống nhất nước Đức.", "correct": false}, {"text": "Cách mạng tư sản Pháp.", "correct": true}, {"text": "Cách mạng Hà Lan (Nê-đéc-lan).", "correct": false}]}, {"type": "mc", "prompt": "Câu 4. Cách mạng công nghiệp diễn ra từ thập kỉ 60 của thế kỷ XVIII bắt đầu từ quốc gia nào?", "options": [{"text": "Pháp.", "correct": false}, {"text": "Hà Lan.", "correct": false}, {"text": "Anh.", "correct": true}, {"text": "Đức.", "correct": false}]}, {"type": "mc", "prompt": "Câu 17. Nội dung nào sau đây là tiền đề về kinh tế dẫn đến sự bùng nổ và thắng lợi của các cuộc cách mạng tư sản từ giữa thế kỷ XVI đến đầu thế kỷ XX?", "options": [{"text": "Giai cấp tư sản và đồng minh có thế lực rất lớn cả về kinh tế và chính trị.", "correct": false}, {"text": "Quan hệ sản xuất tư bản chủ nghĩa thay thế hoàn toàn quan hệ phong kiến.", "correct": false}, {"text": "Triết học Ánh sáng ra đời, thức tỉnh, dọn đường cho quần chúng đấu tranh.", "correct": false}, {"text": "Những rào cản của chế độ phong kiến kìm hãm kinh tế tư bản chủ nghĩa.", "correct": true}]}, {"type": "mc", "prompt": "Câu 10. Một trong những mục tiêu của các cuộc cách mạng tư sản từ giữa thế kỷ XVI đến đầu thế kỷ XX là", "options": [{"text": "Xác lập sự thống trị của chủ nghĩa thực dân.", "correct": false}, {"text": "Xóa bỏ những rào cản của chế độ phong kiến.", "correct": true}, {"text": "Xóa bỏ triệt để những mâu thuẫn trong xã hội.", "correct": false}, {"text": "Đưa giai cấp công nhân lên nắm chính quyền.", "correct": false}]}, {"type": "mc", "prompt": "Câu 30. Lĩnh vực nào sau đây là tiềm năng phát triển của chủ nghĩa tư bản hiện đại?", "options": [{"text": "Khoa học – công nghệ.", "correct": false}, {"text": "Chính trị, ngoại giao.", "correct": false}, {"text": "Quân sự, văn hóa.", "correct": false}, {"text": "Văn hóa – giáo dục.", "correct": true}]}, {"type": "mc", "prompt": "Câu 1. Nội dung nào sau đây phản ánh đúng mục tiêu đấu tranh của giai cấp tư sản Pháp cuối thế kỷ XVIII?", "options": [{"text": "Xóa bỏ tình trạng phân tán về chính trị.", "correct": false}, {"text": "Lật đổ chế độ quân chủ chuyên chế.", "correct": true}, {"text": "Xác lập sự thống trị của chủ nghĩa thực dân.", "correct": false}, {"text": "Giải phóng dân tộc, lập nên quốc gia mới.", "correct": false}]}, {"type": "tf", "prompt": "Câu 37. Đọc đoạn trích sau đây:", "statements": [{"text": "Tình hình chính trị ở Pháp dưới triều vua Lu-i XVI khủng hoảng trầm trọng.", "answer": "Đ"}, {"text": "Chính sách cai trị của nhà nước phong kiến chuyên chế gây bất mãn cho nhân dân.", "answer": "Đ"}, {"text": "Sự tồn tại của nhà nước quân chủ lập hiến gây bất mãn cho tầng lớp quý tộc mới.", "answer": "S"}, {"text": "Mâu thuẫn giữa đẳng cấp thứ ba với đẳng cấp tăng lữ và quý tộc ngày càng sâu sắc.", "answer": "S"}]}, {"type": "mc", "prompt": "Câu 35. Nội dung nào sau đây phản ánh đúng về bản chất chủ nghĩa tư bản hiện đại?", "options": [{"text": "Luôn tìm cách xóa bỏ sự chênh lệch giàu nghèo và những bất công xã hội.", "correct": false}, {"text": "Theo đuổi lợi nhuận là mục tiêu cao nhất và cuối cùng của các nhà tư bản.", "correct": true}, {"text": "Đầu tư, hợp tác nhằm mục tiêu thúc đẩy sự phát triển kinh tế toàn cầu.", "correct": false}, {"text": "Không ngừng đấu tranh đòi quyền lợi chính đáng cho người lao động.", "correct": false}]}, {"type": "mc", "prompt": "Câu 31. Nội dung nào sau đây là tiềm năng phát triển của chủ nghĩa tư bản hiện đại?", "options": [{"text": "Kinh nghiệm quản lí.", "correct": true}, {"text": "Liên minh quân sự.", "correct": false}, {"text": "Hợp tác quốc tế.", "correct": false}, {"text": "Liên kết khu vực.", "correct": false}]}, {"type": "mc", "prompt": "Câu 18. Nội dung nào sau đây là tiền đề về chính trị dẫn đến sự bùng nổ và thắng lợi của các cuộc cách mạng tư sản từ giữa thế kỷ XVI đến đầu thế kỷ XX?", "options": [{"text": "Giai cấp tư sản và đồng minh có thế lực rất lớn cả về kinh tế và chính trị.", "correct": false}, {"text": "Triết học Ánh sáng ra đời, thức tỉnh, dọn đường cho quần chúng đấu tranh.", "correct": false}, {"text": "Chế độ cai trị của nhà nước phong kiến, gây ra sự bất mãn trong xã hội.", "correct": true}, {"text": "Quan hệ sản xuất tư bản chủ nghĩa thay thế hoàn toàn quan hệ phong kiến.", "correct": false}]}, {"type": "mc", "prompt": "Câu 34. Yếu tố nào sau đây đưa đến sự chuyển biến của chủ nghĩa tư bản từ tự do cạnh tranh sang giai đoạn độc quyền?", "options": [{"text": "Sự phát triển của lực lượng sản xuất dưới tác dụng của tiến bộ khoa học – kỹ thuật.", "correct": true}, {"text": "Sự sáp nhập của các công ty độc quyền và sự ra đời các tổ chức tín dụng quốc tế.", "correct": false}, {"text": "Sự ra đời và phát triển của các tổ chức liên kết khu vực nhiều nơi trên thế giới.", "correct": false}, {"text": "Sự hình thành phát triển của các trung tâm kinh tế tài chính nhiều nơi trên thế giới.", "correct": false}]}, {"type": "mc", "prompt": "Câu 29. Đầu thế kỉ XX, quốc gia nào sau đây có hệ thống thuộc địa rộng lớn nhất?", "options": [{"text": "I-ta-li-a.", "correct": false}, {"text": "Anh.", "correct": true}, {"text": "Nhật.", "correct": false}, {"text": "Đức.", "correct": false}]}, {"type": "mc", "prompt": "Câu 14. Lực lượng nào sau đây không phải là lãnh đạo của các cuộc cách mạng tư sản từ giữa thế kỷ XVI đến đầu thế kỷ XX?", "options": [{"text": "Giai cấp công nhân.", "correct": true}, {"text": "Quý tộc tư sản hóa.", "correct": false}, {"text": "Quý tộc mới.", "correct": false}, {"text": "Giai cấp tư sản.", "correct": false}]}, {"type": "mc", "prompt": "Câu 24. Để giải quyết những mâu thuẫn xung quanh vấn đề thuộc địa vào thế kỉ XX, các nước đế quốc đã", "options": [{"text": "Tiến hành cải cách kinh tế, chính trị sâu rộng để tạo ảnh hưởng.", "correct": false}, {"text": "Thành lập liên minh các nước đế quốc để chống lại nước Anh.", "correct": false}, {"text": "Đàn áp các phong trào đấu tranh của nhân dân trong nước.", "correct": false}, {"text": "Gây ra cuộc chiến tranh thế giới để chia lại thị trường, thuộc địa.", "correct": true}]}, {"type": "mc", "prompt": "Câu 36. Nội dung nào sau đây không phải là thách thức mà chủ nghĩa tư bản hiện đại đang phải đối mặt?", "options": [{"text": "Tệ nạn xã hội, phân biệt chủng tộc.", "correct": false}, {"text": "Tốc độ phát triển kinh tế toàn cầu.", "correct": true}, {"text": "Sự chênh lệch giàu nghèo.", "correct": false}, {"text": "Khủng hoảng kinh tế, tài chính.", "correct": false}]}, {"type": "mc", "prompt": "Câu 8. Vào cuối thế kỷ XIX – đầu thế kỷ XX, sự kiện nào dưới đây đã góp phần mở rộng phạm vi của chủ nghĩa tư bản ở khu vực châu Á?", "options": [{"text": "Cách mạng Tân Hợi ở Trung Quốc thành công.", "correct": true}, {"text": "Khởi nghĩa Thái Bình Thiên Quốc.", "correct": false}, {"text": "Nước Cộng hòa nhân dân Trung Hoa ra đời.", "correct": false}, {"text": "Duy Tân Mậu Tuất (1898) ở Trung Quốc thành công.", "correct": false}]}, {"type": "mc", "prompt": "Câu 16. Trong các cuộc cách mạng tư sản từ giữa thế kỷ XVI đến đầu thế kỷ XX, động lực quyết định thắng lợi của cách mạng là", "options": [{"text": "Phương pháp đấu tranh.", "correct": false}, {"text": "Mục tiêu của cách mạng.", "correct": false}, {"text": "Kết quả cuối cùng.", "correct": false}, {"text": "Quần chúng nhân dân.", "correct": true}]}, {"type": "mc", "prompt": "Câu 9. Một trong những mục tiêu của các cuộc cách mạng tư sản từ giữa thế kỷ XVI đến đầu thế kỷ XX là", "options": [{"text": "Đưa giai cấp công nhân lên nắm chính quyền.", "correct": false}, {"text": "Mở đường cho tư bản chủ nghĩa phát triển.", "correct": true}, {"text": "Xóa bỏ triệt để những mâu thuẫn trong xã hội.", "correct": false}, {"text": "Xác lập sự thống trị của chủ nghĩa thực dân.", "correct": false}]}, {"type": "mc", "prompt": "Câu 11. Lãnh đạo của các cuộc cách mạng tư sản từ Nội dung nào sau đây là tiền đề về tư tưởng dẫn đến sự bùng nổ và thắng lợi của cuộc cách mạng tư sản Pháp ở thế kỉ XVIII?", "options": [{"text": "Triết học Ánh sáng ra đời, thức tỉnh, dọn đường cho quần chúng đấu tranh.", "correct": true}, {"text": "Mâu thuẫn giữa giai cấp tư sản với quý tộc phong kiến ngày càng sâu sắc.", "correct": false}, {"text": "Giai cấp tư sản và đồng minh có thế lực rất lớn cả về kinh tế và chính trị.", "correct": false}, {"text": "Quan hệ sản xuất tư bản chủ nghĩa thay thế hoàn toàn quan hệ phong kiến.", "correct": false}]}, {"type": "mc", "prompt": "Câu 28. Cho đến cuối thế kỉ XIX, các nước đế quốc đã thiết lập hệ thống thuộc địa rộng khắp ở", "options": [{"text": "Châu Âu, châu Úc và khu vực Bắc Mỹ.", "correct": false}, {"text": "Châu Á, châu Phi và khu vực Mỹ La-tinh.", "correct": true}, {"text": "Châu Mỹ, Tây Âu và khu vực Đông Âu.", "correct": false}, {"text": "Châu Âu, châu Mỹ và khu vực Tây Âu.", "correct": false}]}, {"type": "mc", "prompt": "Câu 25. Từ đầu thế kỉ XIX, để đáp ứng nhu cầu ngày càng cao về nguyên liệu và nhân công các nước tư bản phương Tây đã tăng cường", "options": [{"text": "Đổi mới hình thức kinh doanh.", "correct": false}, {"text": "Xâm lược và mở rộng thuộc địa.", "correct": true}, {"text": "Hợp tác và mở rộng đầu tư.", "correct": false}, {"text": "Thu hút vốn đầu tư bên ngoài.", "correct": false}]}, {"type": "mc", "prompt": "Câu 15. Trong các cuộc cách mạng tư sản từ giữa thế kỷ XVI đến đầu thế kỷ XX, động lực quyết định thắng lợi của cách mạng là", "options": [{"text": "Phương pháp đấu tranh.", "correct": false}, {"text": "Kết quả cuối cùng.", "correct": false}, {"text": "Giai cấp lãnh đạo.", "correct": true}, {"text": "Mục tiêu của cách mạng.", "correct": false}]}, {"type": "mc", "prompt": "Câu 26. Cuối thế kỉ XIX – đầu thế kỷ XX, các nước tư bản chủ nghĩa đã chuyển sang giai đoạn", "options": [{"text": "Tự do cạnh tranh.", "correct": false}, {"text": "Chủ nghĩa phát xít.", "correct": false}, {"text": "Đế quốc chủ nghĩa.", "correct": true}, {"text": "Cải cách đất nước.", "correct": false}]}, {"type": "mc", "prompt": "Câu 32. Nội dung nào sau đây là thách thức mà chủ nghĩa tư bản hiện đại phải đối mặt?", "options": [{"text": "Khủng hoảng kinh tế, tài chính mang tính toàn cầu.", "correct": true}, {"text": "Sự phát triển mạnh mẽ của khoa học – công nghệ.", "correct": false}, {"text": "Sự vươn lên mạnh mẽ của các nước đang phát triển.", "correct": false}, {"text": "Sự sập nhập của các công ty độc quyền lũng đoạn.", "correct": false}]}];
const mc=document.getElementById('mc'),tf=document.getElementById('tf');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let displayNum=0;
questions.forEach((q,index)=>{
 const card=document.createElement('section');card.className='q';displayNum=index+1;
 const h=document.createElement('h3');h.textContent='Câu '+displayNum+'. '+q.prompt.replace(/^Câu\s+\d+\.\s*/,'');card.appendChild(h);
 if(q.type==='mc'){
  q.options.forEach((o,i)=>{const lab=document.createElement('label');lab.className='opt';lab.innerHTML=`<input type="radio" name="q${index}" value="${i}"><span><b>${String.fromCharCode(65+i)}.</b> ${esc(o.text)}</span>`;card.appendChild(lab)});mc.appendChild(card);
 }else{
  q.statements.forEach((s,j)=>{const wrap=document.createElement('div');wrap.className='statement';wrap.innerHTML=`<p><b>${String.fromCharCode(97+j)})</b> ${esc(s.text)}</p>`;const choices=document.createElement('div');choices.className='tfchoices';
  [['Đ','Đúng'],['S','Sai']].forEach(([v,label])=>{const lab=document.createElement('label');lab.className='opt';lab.innerHTML=`<input type="radio" name="q${index}_${j}" value="${v}"><span>${label}</span>`;choices.appendChild(lab)});wrap.appendChild(choices);card.appendChild(wrap)});tf.appendChild(card);
 }
});
function updateProgress(){let n=0,total=0;questions.forEach((q,i)=>{if(q.type==='mc'){total++;if(document.querySelector(`input[name="q${i}"]:checked`))n++}else q.statements.forEach((s,j)=>{total++;if(document.querySelector(`input[name="q${i}_${j}"]:checked`))n++})});document.getElementById('count').textContent=`Đã trả lời ${n}/${total} ý`;document.getElementById('bar').style.width=(100*n/total)+'%'}
document.getElementById('quiz').addEventListener('change',updateProgress);updateProgress();
function submitQuiz(){let correct=0,total=0,review='',mcCorrect=0,mcTotal=0,tfCorrect=0,tfTotal=0;
 questions.forEach((q,i)=>{if(q.type==='mc'){mcTotal++;total++;const chosen=document.querySelector(`input[name="q${i}"]:checked`);const right=q.options.findIndex(o=>o.correct);const ok=chosen&&Number(chosen.value)===right;if(ok){correct++;mcCorrect++}review+=`<div class="review"><b>Câu ${i+1} · Trắc nghiệm:</b> ${ok?'<span class="good">Đúng</span>':'<span class="bad">'+(chosen?'Sai':'Chưa trả lời')+'</span>'}<br><span class="sub">Đáp án đúng: ${String.fromCharCode(65+right)}. ${esc(q.options[right].text)}</span></div>`}
 else{q.statements.forEach((s,j)=>{total++;tfTotal++;const chosen=document.querySelector(`input[name="q${i}_${j}"]:checked`);const ok=chosen&&chosen.value===s.answer;if(ok){correct++;tfCorrect++}review+=`<div class="review"><b>Câu ${i+1}, ý ${String.fromCharCode(97+j)}:</b> ${ok?'<span class="good">Đúng</span>':'<span class="bad">'+(chosen?'Sai':'Chưa trả lời')+'</span>'}<br><span class="sub">Đáp án đúng: ${s.answer==='Đ'?'Đúng':'Sai'}.</span></div>`})}});
 const pct=Math.round(correct/total*100);const box=document.getElementById('result');box.style.display='block';box.innerHTML=`<h2>🎉 Kết quả của bà</h2><div class="score">${correct}/${total} ý đúng · ${pct}%</div><p>Trắc nghiệm: <b>${mcCorrect}/${mcTotal}</b> câu đúng</p><p>Đúng – sai: <b>${tfCorrect}/${tfTotal}</b> ý đúng</p><p class="sub">Mỗi câu trắc nghiệm tính 1 điểm; mỗi ý đúng–sai tính 1 điểm. Tổng tối đa 56 điểm thô.</p><h3>Đáp án và phần xem lại</h3>${review}`;box.scrollIntoView({behavior:'smooth'})}
function resetQuiz(){document.getElementById('quiz').reset();document.getElementById('result').style.display='none';updateProgress();window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
